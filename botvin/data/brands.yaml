# Words that make an item worth much less, matched in title + description.
# Multilingual (EN, LT, PL, FI, DE, FR, ES, IT, NL). These do NOT exclude the
# item -- a damaged TNF Summit Series can still flip -- they just discount it.
damage_keywords:
  - damaged
  - broken
  - hole
  - stain
  - ripped
  - torn
  - defect
  - uszkodz     # PL uszkodzony
  - dziur       # PL dziura
  - plam        # PL plama
  - rozdar      # PL rozdarty
  - sugad       # LT sugadintas
  - skyl        # LT skylė
  - dėm         # LT dėmė
  - plyš        # LT plyšys
  - rikki       # FI
  - reikä       # FI
  - tahra       # FI
  - kaputt      # DE
  - loch        # DE
  - fleck       # DE
  - defekt      # DE / PL / LT
  - abîm        # FR
  - trou        # FR
  - tache       # FR
  - roto        # ES / IT
  - mancha      # ES
  - strapp      # IT
  - kapot       # NL
  - vlek        # NL

# Words that suggest a counterfeit -- these items are skipped entirely.
fake_keywords:
  - replica
  - fake
  - "1:1"
  - podróbk     # PL
  - kopija      # LT
  - inspired
  - "aaa+"
  - nachgemacht

# Words that suggest a kids' item. Skipped entirely unless filters.exclude_kids: false.
kids_keywords:
  - kids
  - junior
  - boys
  - girls
  - dziecię     # PL
  - chłopi      # PL chłopięca
  - dziewcz     # PL dziewczęca
  - vaik        # LT vaikiška
  - lasten      # FI
  - kinder      # DE
  - enfant      # FR
  - niño        # ES
  - bambin      # IT
  - bērnu       # LV
  - laste       # ET
  - youth
  - toddler
  - infant
  - "kid's"
  - teen
  - berniuk     # LT boy's
  - mergait     # LT girl's
  - kūdik       # LT baby
  - dziecka     # PL dla dziecka
  - dzieci      # PL
  - chłopc      # PL dla chłopca
  - niemowl     # PL baby
  - jugend      # DE
  - mädchen     # DE
  - jungen      # DE
  - garçon      # FR
  - fille       # FR
  - bébé        # FR

