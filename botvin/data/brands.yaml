# Words that make an item worth much less, matched in title + description.
# Multilingual (EN, LT, PL, FI, DE, FR, ES, IT, NL). These do NOT exclude the
# item -- a damaged TNF Summit Series can still flip -- they just discount it.
damage_keywords:
  - damaged
  - broken
  - hole
  - stain
  - ripped
  - torn
  - defect
  - uszkodz     # PL uszkodzony
  - dziur       # PL dziura
  - plam        # PL plama
  - rozdar      # PL rozdarty
  - sugad       # LT sugadintas
  - skyl        # LT skylė
  - dėm         # LT dėmė
  - plyš        # LT plyšys
  - rikki       # FI
  - reikä       # FI
  - tahra       # FI
  - kaputt      # DE
  - loch        # DE
  - fleck       # DE
  - defekt      # DE / PL / LT
  - abîm        # FR
  - trou        # FR
  - tache       # FR
  - roto        # ES / IT
  - mancha      # ES
  - strapp      # IT
  - kapot       # NL
  - vlek        # NL

# Words that suggest a counterfeit -- these items are skipped entirely.
fake_keywords:
  - replica
  - fake
  - "1:1"
  - podróbk     # PL
  - kopija      # LT
  - inspired
  - "aaa+"
  - nachgemacht

# Words that suggest a kids' item (much lower resale for these brands).
kids_keywords:
  - kids
  - junior
  - boys
  - girls
  - dziecię     # PL
  - chłopi      # PL chłopięca
  - dziewcz     # PL dziewczęca
  - vaik        # LT vaikiška
  - lasten      # FI
  - kinder      # DE
  - enfant      # FR
  - niño        # ES
  - bambin      # IT

# Model names that signal the high end of a brand. Each one multiplies the
# resale estimate (and can force a category).
premium_keywords:
  "gore-tex": {mult: 1.25, category: shell}
  "goretex": {mult: 1.25, category: shell}
  "gtx": {mult: 1.15}
  "summit series": {mult: 1.5}
  "nuptse": {mult: 1.35, category: puffer}
  "himalayan": {mult: 1.5, category: puffer}
  "mcmurdo": {mult: 1.3, category: puffer}
  "nano puff": {mult: 1.15, category: puffer}
  "down sweater": {mult: 1.15, category: puffer}
  "retro-x": {mult: 1.25, category: fleece}
  "retro x": {mult: 1.25, category: fleece}
  "alpha sv": {mult: 1.6, category: shell}
  "beta ar": {mult: 1.4, category: shell}
  "beta lt": {mult: 1.3, category: shell}
  "atom": {mult: 1.0, category: puffer}
  "cerium": {mult: 1.2, category: puffer}
  "omni-heat": {mult: 1.15, category: puffer}
  "titanium": {mult: 1.2}
  "bedale": {mult: 1.2, category: coat}
  "beaufort": {mult: 1.2, category: coat}
  "detroit": {mult: 1.3, category: jacket}
  "ghost piece": {mult: 1.3}
  "maya": {mult: 1.2, category: puffer}
